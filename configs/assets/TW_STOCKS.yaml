      has_fast_slow: true
    EMA_Cluster:
      source: close
      len1: 45 
      len2: 90 
      len3: 180 
      len4: 360 
      has_fast_slow: true
    Bollinger_Bands:
      source: close
      period: 45 
      std: 2.0
    ATR:
      Len: 18
  60m: 
    RSI:
      source: close
      period: 14 
    MACD:
      source: close
      fast_period: 10 
      slow_period: 22 
      signal_period: 9
      has_fast_slow: true
    EMA_Cluster:
      source: close
      len1: 22 
      len2: 90 
      len3: 270 
      len4: 540 
      has_fast_slow: true
    Bollinger_Bands:
      source: close
      period: 22 
      std: 2.0
    ATR:
      Len: 14
  1d:
    RSI:
      source: close
      period: 14 
    MACD:
      source: close
      fast_period: 12
      slow_period: 26 
      signal_period: 9
      has_fast_slow: true
    EMA_Cluster:
      source: close
      len1: 10 
      len2: 20 
      len3: 60 
      len4: 120 
      has_fast_slow: true
    Bollinger_Bands:
      source: close
      period: 20 
      std: 2.0
    ATR:
      Len: 14

meta_features_plan:
  - id: MACD
    indicator: MACD
  - id: RSI
    indicator: RSI
  - id: ATR
    indicator: ATR
  - id: Bollinger_Bands
    indicator: Bollinger_Bands
  - id: EMA_Cluster
